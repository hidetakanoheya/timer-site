<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Tools</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-size: 2rem;
      letter-spacing: 4px;
      color: #e2e8f0;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    header p {
      color: #636e8a;
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 560px;
    }

    .card {
      background: #16213e;
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      display: block;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .card .icon {
      font-size: 3rem;
      margin-bottom: 16px;
      line-height: 1;
    }

    .card .title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: #e2e8f0;
    }

    .card .desc {
      font-size: 0.85rem;
      color: #636e8a;
      line-height: 1.5;
    }

    .card.timer .icon { color: #63b3ed; }
    .card.timer .title { color: #63b3ed; }

    .card.pokemon .icon { color: #ffd700; }
    .card.pokemon .title { color: #ffd700; }

    footer {
      margin-top: 48px;
      color: #636e8a;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Claude Tools</h1>
    <p>小さなウェブアプリ集やで</p>
  </header>

  <div class="grid">
    <a href="timer.html" class="card timer">
      <div class="icon">⏱</div>
      <div class="title">Stopwatch</div>
      <div class="desc">ラップタイム計測付きのシンプルなストップウォッチ</div>
    </a>
    <a href="pokemon.html" class="card pokemon">
      <div class="icon">🎲</div>
      <div class="title">Random Pokemon</div>
      <div class="desc">ポケAPIでランダムなポケモンをどんどん表示するで</div>
    </a>
  </div>

  <footer>Built with Claude Code</footer>
</body>
</html>
